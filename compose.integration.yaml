# DISPOSABLE integration-test database. Safe for agents to start, stop, and delete.
#
# - It holds only data generated by tests; nothing here is real or important.
# - The test session itself drops and recreates the "bird_recognition_test" database.
# - It is fully separate from compose.yaml (own project name, port, and volume),
#   so it never touches the persistent application database.
# - `down -v` is safe HERE. Never run it against compose.yaml.
#
# Usage (PowerShell, from the repository root):
#   podman compose -f compose.integration.yaml up -d --wait
#   $env:BIRD_RECOGNITION_TEST_DATABASE_URL = "postgresql://bird_recognition_test:bird_recognition_test@localhost:5433/bird_recognition_test"
#   .\.venv\Scripts\python.exe -m pytest tests\integration
#   podman compose -f compose.integration.yaml down -v   # optional: remove container and data
name: bird-recognition-integration-test

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: bird_recognition_test
      POSTGRES_PASSWORD: bird_recognition_test
    ports:
      # Bound to loopback only; 5433 avoids clashing with compose.yaml on 5432.
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Disposable test data; safe to delete at any time.
  postgres_test_data:
