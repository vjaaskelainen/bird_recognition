[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bird-recognition"
version = "0.1.0"
description = "Search and question-answering over trail-camera bird footage"
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.1,<20",
    "numpy>=2.2,<3",
    "omegaconf>=2.4.0,<3",
    "Pillow>=12.3.0,<13",
    "python-dotenv>=1.0,<2",
    "pytorchwildlife==1.3.0",
    "torch>=2.14.1,<2.15",
    "open-clip-torch>=2.32,<4",
    "torchvision>=0.25,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    # Required by PyTorch-Wildlife
    "soundfile",
    "librosa",
]

[project.scripts]
bird-recognition = "bird_recognition.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.11",
    "copier>=9.10",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "real_database: requires explicit opt-in to a disposable local database",
    "local_model: requires explicit opt-in to local model assets",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bird_recognition"]

[tool.hatch.build.targets.wheel.force-include]
"src/bird_recognition/embed/migrations" = "bird_recognition/embed/migrations"

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
