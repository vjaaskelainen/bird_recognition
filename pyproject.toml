[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bird-recognition"
version = "0.1.0"
description = "Search and question-answering over trail-camera bird footage"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bird_recognition"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
