[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bird-recognition"
version = "0.1.0"
description = "Search and question-answering over trail-camera bird footage"
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.1,<20",
    "numpy>=2.2,<3",
    "omegaconf>=2.4.0,<3",
    "Pillow>=12.3.0,<13",
    "pytorchwildlife==1.3.0",
    "torch>=2.14.1,<2.15",
]

[project.scripts]
bird-recognition = "bird_recognition.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.11",
    "copier>=9.10",
    "pytest>=9.1.1,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bird_recognition"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
